name: GitHub Workflow Activities

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-html-and-readme
  cancel-in-progress: false

jobs:
  update_html_and_readme:
    if: github.actor == 'Sakura-zz26' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Update HTML for the workflow actor
        run: python3 scripts/update_records.py html

      - name: Update README with actor and source commit
        run: python3 scripts/update_records.py readme

      - name: Commit and push generated changes
        env:
          ACTOR: ${{ github.actor }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html README.md
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m "Workflow: Update HTML and README for ${ACTOR}"
            git push origin HEAD:main
          fi

